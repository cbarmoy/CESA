name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag de release (lancer depuis la branche main, pas depuis le tag)'
        required: false
        default: 'v0.0beta2.1'
        type: string

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Resolve version
      id: ver
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}"
        if ([string]::IsNullOrWhiteSpace($version)) { $version = "${{ github.ref_name }}" }
        if ($version -notmatch '^v') { $version = "v$version" }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Install build backend
      run: |
        python -m pip install --upgrade pip
        python -m pip install build

    - name: Build distribution
      run: python -m build --sdist --wheel

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.version }}
        files: dist/*
        draft: false
        prerelease: ${{ contains(needs.build.outputs.version, 'alpha') || contains(needs.build.outputs.version, 'beta') || contains(needs.build.outputs.version, 'rc') }}
        generate_release_notes: true
        body: |
          ## CESA ${{ needs.build.outputs.version }}

          Release notes for CESA (Complex EEG Studio Analysis).

          ### Installation
          1. Install Python ≥ 3.10
          2. `pip install -r requirements.txt`
          3. Launch `python run.py`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
